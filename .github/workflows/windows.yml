name: Windows x64 preview
on:
  push:
    branches: [main]
    tags: [v0.1.0-preview]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Configure Windows x64 (static MSVC runtime)
        run: cmake -S . -B build -A x64 -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON
      - name: Build
        run: cmake --build build --config Release --parallel 2
      - name: Test actual Windows PDFium DLL
        run: ctest --test-dir build -C Release --output-on-failure --no-tests=error
      - name: Test first page in the actual main window
        shell: pwsh
        run: |
          $process = Start-Process build/Release/sPDF.exe -ArgumentList '--smoke-test', "$pwd/tests/fixtures/sample.pdf" -PassThru
          if (-not $process.WaitForExit(45000)) { $process.Kill(); throw 'GUI smoke test timed out' }
          if ($process.ExitCode -ne 0) { throw "GUI smoke test failed: $($process.ExitCode)" }
      - name: Create portable ZIP
        run: cpack --config build/CPackConfig.cmake -C Release -B dist
      - name: Verify package and dependencies
        run: python scripts/check-package.py dist/sPDF-0.1.0-preview-win-x64.zip
      - name: Record package checksum
        shell: pwsh
        run: |
          $zip = 'dist/sPDF-0.1.0-preview-win-x64.zip'
          $hash = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  sPDF-0.1.0-preview-win-x64.zip" | Set-Content "$zip.sha256" -Encoding utf8
      - name: Publish preview artifact
        uses: actions/upload-artifact@v4
        with:
          name: sPDF-0.1.0-preview-win-x64
          path: |
            dist/sPDF-0.1.0-preview-win-x64.zip
            dist/sPDF-0.1.0-preview-win-x64.zip.sha256
          if-no-files-found: error
          retention-days: 30
  release:
    if: github.ref == 'refs/tags/v0.1.0-preview'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: sPDF-0.1.0-preview-win-x64
          path: dist
      - name: Publish verified Windows preview
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            dist/sPDF-0.1.0-preview-win-x64.zip \
            dist/sPDF-0.1.0-preview-win-x64.zip.sha256 \
            --verify-tag --prerelease --latest=false \
            --title 'sPDF Megtekintő 0.1.0 – fejlesztői előzetes' \
            --notes-file docs/RELEASE-0.1.0.md
